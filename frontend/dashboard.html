<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="card p-4 shadow">
            <h3>Área Protegida</h3>
            <p>Escolha uma rota para testar:</p>

            <button class="btn btn-primary w-100 mb-2" onclick="acessar('/auth/user-area')">Área Usuário</button>
            <button class="btn btn-warning w-100 mb-2" onclick="acessar('/auth/professor-area')">Área Professor</button>
            <button class="btn btn-danger w-100 mb-2" onclick="acessar('/auth/admin-area')">Área Admin</button>

            <button class="btn btn-secondary w-100 mt-3" onclick="logout()">Sair</button>

            <div id="resp" class="mt-4"></div>
        </div>
    </div>

    <script>
        // Verifica se há token
        const token = localStorage.getItem('token');

        if (!token) {
            alert('Você precisa estar logado.');
            window.location.href = './index.html';
        }
    </script>

    <script src="js/access.js"></script>
</body>

</html>
